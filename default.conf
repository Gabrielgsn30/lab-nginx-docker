server {
    listen 80;

    # Usa o DNS interno do Docker para resolver os nomes dinamicamente
    resolver 127.0.0.11 valid=30s;

    location / {
        set $target_frontend http://frontend-react:3000;
        proxy_pass $target_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        set $target_backend http://backend-api:8000;
        proxy_pass $target_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}